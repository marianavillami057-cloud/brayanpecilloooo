openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification for Alejandro Pecillo construcción website
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: testimonials
    description: Testimonials
  - name: auth
    description: Authentication
  - name: categories
    description: Category management
  - name: media
    description: Media management
  - name: settings
    description: Cloudinary settings

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized

  /auth/logout:
    post:
      operationId: adminLogout
      tags: [auth]
      summary: Admin logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Get current auth status
      responses:
        "200":
          description: Auth status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Not authenticated

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      parameters:
        - name: includeInactive
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Not found
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /categories/{id}/toggle:
    patch:
      operationId: toggleCategory
      tags: [categories]
      summary: Toggle category active/inactive
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /media:
    get:
      operationId: listMedia
      tags: [media]
      summary: List media items
      parameters:
        - name: categoryId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of media
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaItem"
    post:
      operationId: createMedia
      tags: [media]
      summary: Create a media item (upload to Cloudinary)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"

  /media/{id}:
    patch:
      operationId: updateMedia
      tags: [media]
      summary: Update a media item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
        "404":
          description: Not found
    delete:
      operationId: deleteMedia
      tags: [media]
      summary: Delete a media item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /testimonials:
    get:
      operationId: listTestimonials
      tags: [testimonials]
      summary: List testimonials
      parameters:
        - name: includeInactive
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of testimonials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Testimonial"
    post:
      operationId: createTestimonial
      tags: [testimonials]
      summary: Create a testimonial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestimonialInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Testimonial"

  /testimonials/{id}:
    patch:
      operationId: updateTestimonial
      tags: [testimonials]
      summary: Update a testimonial
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestimonialUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Testimonial"
    delete:
      operationId: deleteTestimonial
      tags: [testimonials]
      summary: Delete a testimonial
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /testimonials/{id}/toggle:
    patch:
      operationId: toggleTestimonial
      tags: [testimonials]
      summary: Toggle testimonial active/inactive
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Testimonial"

  /settings/contact:
    get:
      operationId: getContactSettings
      tags: [settings]
      summary: Get contact settings (public)
      responses:
        "200":
          description: Contact settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSettings"
    put:
      operationId: updateContactSettings
      tags: [settings]
      summary: Update contact settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactSettingsInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSettings"

  /settings/stats:
    get:
      operationId: getStatsSettings
      tags: [settings]
      summary: Get stats settings (public)
      responses:
        "200":
          description: Stats settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSettings"
    put:
      operationId: updateStatsSettings
      tags: [settings]
      summary: Update stats settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatsSettingsInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSettings"

  /settings/hero:
    get:
      operationId: getHeroSettings
      tags: [settings]
      summary: Get hero image settings
      responses:
        "200":
          description: Hero settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeroSettings"
    put:
      operationId: updateHeroSettings
      tags: [settings]
      summary: Update hero image settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeroSettingsInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeroSettings"

  /settings/cloudinary:
    get:
      operationId: getCloudinarySettings
      tags: [settings]
      summary: Get Cloudinary settings
      responses:
        "200":
          description: Cloudinary settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudinarySettings"
    put:
      operationId: updateCloudinarySettings
      tags: [settings]
      summary: Update Cloudinary settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudinarySettingsInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudinarySettings"

  /media/upload-signature:
    post:
      operationId: getUploadSignature
      tags: [media]
      summary: Get Cloudinary upload signature
      responses:
        "200":
          description: Upload signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSignature"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
        email:
          type: ["string", "null"]

    Category:
      type: object
      required: [id, name, order, active, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        order:
          type: integer
        active:
          type: boolean
        createdAt:
          type: string

    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        order:
          type: integer
        active:
          type: boolean

    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
        order:
          type: integer
        active:
          type: boolean

    MediaItem:
      type: object
      required: [id, title, type, url, categoryId, order, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        type:
          type: string
          enum: [photo, video]
        url:
          type: string
        publicId:
          type: ["string", "null"]
        thumbnailUrl:
          type: ["string", "null"]
        categoryId:
          type: integer
        order:
          type: integer
        createdAt:
          type: string

    MediaInput:
      type: object
      required: [title, type, url, categoryId]
      properties:
        title:
          type: string
        type:
          type: string
          enum: [photo, video]
        url:
          type: string
        publicId:
          type: string
        thumbnailUrl:
          type: string
        categoryId:
          type: integer
        order:
          type: integer

    MediaUpdate:
      type: object
      properties:
        title:
          type: string
        categoryId:
          type: integer
        order:
          type: integer

    CloudinarySettings:
      type: object
      required: [cloudName, hasApiKey, hasApiSecret]
      properties:
        cloudName:
          type: ["string", "null"]
        hasApiKey:
          type: boolean
        hasApiSecret:
          type: boolean

    CloudinarySettingsInput:
      type: object
      required: [cloudName, apiKey, apiSecret]
      properties:
        cloudName:
          type: string
        apiKey:
          type: string
        apiSecret:
          type: string

    Testimonial:
      type: object
      required: [id, authorName, content, rating, active, order, createdAt]
      properties:
        id:
          type: integer
        authorName:
          type: string
        role:
          type: ["string", "null"]
        content:
          type: string
        rating:
          type: integer
        active:
          type: boolean
        order:
          type: integer
        createdAt:
          type: string

    TestimonialInput:
      type: object
      required: [authorName, content]
      properties:
        authorName:
          type: string
        role:
          type: string
        content:
          type: string
        rating:
          type: integer
        active:
          type: boolean
        order:
          type: integer

    TestimonialUpdate:
      type: object
      properties:
        authorName:
          type: string
        role:
          type: string
        content:
          type: string
        rating:
          type: integer
        active:
          type: boolean
        order:
          type: integer

    StatsSettings:
      type: object
      required: [projects, years, satisfaction]
      properties:
        projects:
          type: integer
        years:
          type: integer
        satisfaction:
          type: integer

    StatsSettingsInput:
      type: object
      required: [projects, years, satisfaction]
      properties:
        projects:
          type: integer
        years:
          type: integer
        satisfaction:
          type: integer

    HeroSettings:
      type: object
      required: [profileImage, coverImage]
      properties:
        profileImage:
          type: ["string", "null"]
        coverImage:
          type: ["string", "null"]

    HeroSettingsInput:
      type: object
      properties:
        profileImage:
          type: ["string", "null"]
        coverImage:
          type: ["string", "null"]

    ContactSettings:
      type: object
      required: [whatsapp, phone, email]
      properties:
        whatsapp:
          type: string
        phone:
          type: string
        email:
          type: string

    ContactSettingsInput:
      type: object
      required: [whatsapp, phone, email]
      properties:
        whatsapp:
          type: string
        phone:
          type: string
        email:
          type: string

    UploadSignature:
      type: object
      required: [signature, timestamp, apiKey, cloudName]
      properties:
        signature:
          type: string
        timestamp:
          type: integer
        apiKey:
          type: string
        cloudName:
          type: string
